[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leadengine"
version = "0.1.0"
description = "Multi-tenant real estate lead qualification SaaS"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "langgraph>=1.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",
    "langfuse>=2.0.0,<3",  # tracing.py uses the v2 API (lf.trace/lf.generation); v3 removed it
    "pymupdf>=1.24.0",
    "openai>=1.40.0",
    "apscheduler>=3.10.0",
    "pgvector>=0.3.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.40.0",
    "cryptography>=42.0.0",
    "sentry-sdk>=2.0.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "python-multipart>=0.0.9",
    "fastembed>=0.3.0",
    "livekit>=1.0.0",
    "livekit-agents>=1.0.0",
    "livekit-plugins-silero>=1.0.0",
    # Official plugins — the voice agent uses ONLY these (no custom adapters):
    "livekit-plugins-openai>=1.0.0",     # STT (self-hosted Whisper) + TTS
    "livekit-plugins-anthropic>=1.0.0",  # Claude LLM for the call brain
    "edge-tts>=6.1.0",
    "pydub>=0.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
